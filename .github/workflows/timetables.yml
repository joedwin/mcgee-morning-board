name: Refresh timetables

on:
  schedule:
    - cron: '23 10 * * *'        # daily, 3:23 am Pacific (daylight time)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/**', 'tests/**', '.github/workflows/timetables.yml']

permissions:
  contents: write
  pages: write

concurrency:
  group: timetables
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test the generator
        run: python3 -m unittest discover -s tests -v

      - name: Download BART's timetable (public)
        run: |
          curl -fsSL --retry 3 -o bart.zip https://www.bart.gov/dev/schedules/google_transit.zip \
            || curl -fsSL --retry 3 -o bart.zip https://files.mobilitydatabase.org/mdb-53/latest.zip \
            || { echo "::warning::Could not download BART's timetable"; rm -f bart.zip; }
          ls -l bart.zip 2>/dev/null || true

      - name: Download AC Transit's timetable
        env:
          ACT_TOKEN: ${{ secrets.ACT_TOKEN }}
        run: python3 tools/fetch_actransit.py

      - name: Build data/schedule.json
        run: |
          cp data/schedule.json /tmp/previous.json 2>/dev/null || true
          python3 tools/build_schedule.py --actransit "$(cat act_path.txt)" --source "$(cat act_source.txt)" \
            --bart bart.zip --out data/schedule.json
          python3 -c "import json; d=json.load(open('data/schedule.json')); print(json.dumps(d['sources'], indent=1))"

      - name: Commit if the timetable changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python3 tools/schedule_changed.py /tmp/previous.json data/schedule.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/schedule.json
            git commit -m "Refresh timetables from AC Transit and BART feeds"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null || echo "Pages will rebuild on its own"
          else
            git checkout -- data/schedule.json 2>/dev/null || true
          fi
